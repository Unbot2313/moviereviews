<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<!-- <h1>Welcome to Home Page</h1>  -->
<h1>Welcome to Home Page, {{ name }}</h1>
<h2>This is the full home page</h2>

<div class="container">
    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">
                Search for Movie:
            </label>
            <input type="text" class="form-control" name="searchMovie"/>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p>Searching for {{searchTerm}}</p>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
        {% for movie in movies %}
            <div class="col">
                <div class="card h-100">
                    <img src="{{ movie.image.url }}" class="card-img-top" style="height: 240px; object-fit: cover;">
                    <div class="card-body">
                        <h2 class="h5">{{ movie.title }}</h2>
                        <h3 class="h6 text-secondary">{{ movie.description }}</h3>
                        {% if movie.url %}
                            <a href="{{ movie.url }}"> Movie Link </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
    <br/>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
